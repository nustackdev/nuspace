[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuspace-ui"
version = "0.4.0"
description = "nuspace web bundle: compiled UI assets for the nuspace runtime."
license = "AGPL-3.0-or-later"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/nustackdev/nuspace"

[tool.hatch.build.targets.wheel]
packages = ["python/nuspace_ui"]
# `python/nuspace_ui/build` is a link to `dist/`, so an editable install serves
# the last vite build with no reinstall. Exclude it from the package walk; the
# force-include below places the real `dist/` contents at `nuspace_ui/build/`.
exclude = ["python/nuspace_ui/build"]

[tool.hatch.build.targets.wheel.force-include]
"dist" = "nuspace_ui/build"
