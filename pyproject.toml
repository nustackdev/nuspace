[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuspace"
version = "0.3.1"
description = "Nu runtime built on Nu. A self-hosted programmable space that runs Nu apps in a tree of containers and applications."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # The whole stack, every extra. A space runs arbitrary Nu apps and its own
    # sections in pool workers, so it reaches most fabrics: kv for the store,
    # ui for the browser, proxy (invisibles) for the worker's session, mp_pool
    # for the workers themselves. Picking extras just means discovering the
    # missing one at import time.
    "nucore>=0.5.2",
    "nustd[all]>=0.5.2",
    # The compiled web bundle. A separate distribution only because PyPI caps
    # project size and a SPA rebuilt on every UI tweak would eat the quota --
    # not optional. `pip install nuspace` gives you the browser.
    "nuspace-ui>=0.3.0",
    "typing-extensions>=4.7.0",
    "click>=8.0",
    "rich>=10.7",
    "rich-click>=1.6",
]
keywords = [
    "nu",
    "nustack",
    "nuspace",
    "runtime",
    "self-hosted",
    "python",
    "ai-agents",
    "ui",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/nustackdev/nuspace"

[project.scripts]
nuspace = "nuspace.cli:main"

[tool.hatch.build.targets.wheel]
# Whole directories, not python files: the agent's system prompt is prose in
# `nuspace/agent/prompt/text/*.md`, read at runtime through
# importlib.resources. hatchling ships every file under a listed package, so
# this needs no data entry of its own -- but adding an `include` or
# `only-include` here would drop the prose and leave a wheel whose chats
# raise on their first message. Don't.
packages = ["src/nuspace"]

[tool.hatch.build.targets.sdist]
exclude = [
    "ts/node_modules",
    "ts/dist",
]

[tool.uv.sources]
nuspace-ui = { path = "./ts" }
nucore = { path = "../nu", editable = true }
nustd = { path = "../nu/pkgs/nustd", editable = true }
nucli = { path = "../nu/pkgs/nucli", editable = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
source = [
    "src/nuspace",
]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "src",
]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "YTT",
    "S",
    "T20",
    "D",
    "ANN",
    "TC",
    "RUF",
    "PTH",
]
ignore = [
    "E501",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101", "S108", "T20", "D", "E711", "E712", "ANN", "N806",
]
"examples/**/*.py" = [
    "S101", "T20", "D", "ANN",
]

[tool.ruff.lint.isort]
known-first-party = [
    "nuspace",
    "nu",
    "nustd",
    "nucli",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]
